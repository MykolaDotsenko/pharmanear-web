name: Live pharmacy provider smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/provider.js'
      - 'e2e-live/**'
      - '.github/workflows/live-smoke.yml'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config e2e-live/playwright.config.js
