name: Acquire Finland pharmacy catalog
on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish validated data from main'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/build-catalog.py'
      - '.github/workflows/catalog.yml'
permissions:
  contents: read
# One acquisition per ref at a time, so two publications can never race on main.
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y osmium-tool
      - name: Download and filter Geofabrik data
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 420 https://download.geofabrik.de/europe/finland-latest.osm.pbf -o /tmp/finland.osm.pbf
          source_date="$(osmium fileinfo -g header.option.osmosis_replication_timestamp /tmp/finland.osm.pbf)"
          test -n "$source_date"
          osmium tags-filter /tmp/finland.osm.pbf nwr/amenity=pharmacy -o /tmp/pharmacies.osm.pbf
          osmium export /tmp/pharmacies.osm.pbf -a type,id --geometry-types=point,polygon -o /tmp/pharmacies.geojson
          python3 scripts/build-catalog.py /tmp/pharmacies.geojson data/finland-pharmacies.json "$source_date"
      - uses: actions/upload-artifact@v4
        with:
          name: finland-pharmacy-catalog
          path: data/finland-pharmacies.json
      - name: Export compact catalog for review
        run: |
          python3 - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("data/finland-pharmacies.json").read_text())
          print("CATALOG_META " + json.dumps({k:v for k,v in data.items() if k != "elements"}, ensure_ascii=True))
          for i, row in enumerate(data["elements"]):
              print("CATALOG_ROW " + str(i) + " " + json.dumps(row, ensure_ascii=True, separators=(",", ":")))
          print("CATALOG_END " + str(len(data["elements"])))
          PY
      - name: Validate freshness against existing snapshot
        if: github.event_name != 'pull_request'
        run: |
          git show HEAD:data/finland-pharmacies.json > /tmp/previous.json
          python3 - <<'PY'
          import json, datetime as dt
          old=json.load(open('/tmp/previous.json'))
          new=json.load(open('data/finland-pharmacies.json'))
          assert new['sourceDate'] >= old['sourceDate']
          assert len(new['elements']) >= len(old['elements'])*0.8
          assert dt.datetime.now(dt.timezone.utc)-dt.datetime.fromisoformat(new['sourceDate'].replace('Z','+00:00')) < dt.timedelta(days=7)
          PY
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: catalog
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      # Commit on top of the latest main, not the commit that started the run.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: finland-pharmacy-catalog
          path: data
      - name: Verify freshness again before publishing
        run: |
          git fetch origin main
          git show origin/main:data/finland-pharmacies.json > /tmp/current.json
          python3 - <<'PY'
          import json, datetime as dt
          old=json.load(open('/tmp/current.json'))
          new=json.load(open('data/finland-pharmacies.json'))
          date=lambda v: dt.datetime.fromisoformat(v.replace('Z','+00:00'))
          assert date(new['sourceDate']) >= date(old['sourceDate'])
          assert -dt.timedelta(days=1) <= dt.datetime.now(dt.timezone.utc)-date(new['sourceDate']) < dt.timedelta(days=7)
          assert len(new['elements']) >= len(old['elements'])*0.8
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/finland-pharmacies.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Finnish pharmacy catalog"
          git push origin HEAD:main
      - name: Run CI for the published snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
